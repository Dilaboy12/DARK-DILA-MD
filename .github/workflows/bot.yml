name: DARK DILA-MD WhatsApp Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dark-dila-md-bot
  cancel-in-progress: true

jobs:
  start-bot:
    name: Start DARK DILA-MD
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install dependencies
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # Create required folders
      - name: Create Directories
        run: |
          mkdir -p session
          mkdir -p data
          mkdir -p session-cache

      # Restore encrypted WhatsApp session
      - name: Restore Session Cache
        uses: actions/cache/restore@v4
        with:
          path: session-cache/session.enc
          key: dark-dila-session-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dark-dila-session-

      # Decrypt saved session
      - name: Restore WhatsApp Authentication
        env:
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
        run: |
          if [ -z "$SESSION_ENCRYPTION_KEY" ]; then
            echo "SESSION_ENCRYPTION_KEY secret is missing."
            exit 1
          fi

          if [ -f session-cache/session.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -iter 200000 \
              -pass env:SESSION_ENCRYPTION_KEY \
              -in session-cache/session.enc \
              -out session-cache/session.tar.gz

            tar -xzf session-cache/session.tar.gz
            rm -f session-cache/session.tar.gz

            echo "Encrypted session restored."
          else
            echo "No previous session found. Fresh login required."
          fi

      # Start WhatsApp bot
      - name: Start DARK DILA-MD
        env:
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          PAIRING_NUMBER: ${{ secrets.PAIRING_NUMBER }}
          SESSION_ID: ${{ secrets.SESSION_ID }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
        run: |
          echo "Starting DARK DILA-MD..."

          set +e
          timeout 340m npm start
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 124 ]; then
            echo "Bot runtime limit reached."
          elif [ "$STATUS" -ne 0 ]; then
            echo "Bot stopped with error: $STATUS"
            exit "$STATUS"
          fi

      # Encrypt session before saving
      - name: Encrypt WhatsApp Session
        if: always()
        env:
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
        run: |
          mkdir -p session-cache

          if [ -d session ] && [ "$(find session -type f | wc -l)" -gt 0 ]; then
            tar -czf session-cache/session.tar.gz session

            openssl enc -aes-256-cbc -salt -pbkdf2 \
              -iter 200000 \
              -pass env:SESSION_ENCRYPTION_KEY \
              -in session-cache/session.tar.gz \
              -out session-cache/session.enc

            rm -f session-cache/session.tar.gz

            echo "Session encrypted successfully."
          else
            echo "No session files to save."
          fi

      # Save encrypted session
      - name: Save Session Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: session-cache/session.enc
          key: dark-dila-session-${{ github.run_id }}-${{ github.run_attempt }}

      # Finish
      - name: Bot Status
        if: always()
        run: |
          echo "DARK DILA-MD workflow finished."
